name: CI

on:
  schedule:
    - cron: "23 9 * * 1"
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache-dependency-path: server/go.mod

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium firefox

      - name: Install browser regression engine
        run: npm ci --prefix app --ignore-scripts

      - name: Audit dependencies
        run: npm --prefix app audit --audit-level=moderate

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find assets/js -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check sw.js

      - name: Run JavaScript tests
        shell: bash
        run: find tests -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node

      - name: Run Python tests
        env:
          CENTRALPDF_QA_SCREENSHOTS: ${{ runner.temp }}/settings-evidence
        shell: bash
        run: |
          find tests -maxdepth 1 -name '*.test.py' -print0 | sort -z | xargs -0 -n1 python scripts/run-browser-test.py
          python tests/static_integrity.py

      - name: Preserve settings screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: settings-evidence
          path: ${{ runner.temp }}/settings-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Run Go tests
        working-directory: server
        run: go test ./...

      - name: Vet Go server
        working-directory: server
        run: go vet ./...

      - name: Verify reproducible Windows executable
        shell: bash
        run: |
          sha256sum -c checksums.sha256
          cd server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o ../CentralPDF_Local_Server.ci.exe .
          cd ..
          cmp --silent CentralPDF_Local_Server.exe CentralPDF_Local_Server.ci.exe

      - name: Check shipped Go binary against vulnerability database
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" -mode=binary CentralPDF_Local_Server.exe

  app-2-0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Run Vitest tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Check catalog file is up to date
        working-directory: ./
        run: |
          node scripts/extract-tool-catalog.mjs
          git diff --exit-code -- docs/architecture/_CATALOGO_RAW.md
          test "$(grep -cE '^\| (organize|editPdf|merge|split|extract|rotate|watermark|pageNumbers|imagesToPdf|imageConvert|compress|pdfToImage|crop|metadata|normalize|pdfToText|ocr|compare|redact|formBuilder|signPdf|pdfToOffice|documentsToPdf|extractImages|archivePdf|documentAssistant|structuredExtraction|documentAudit|classifyRename|protect|unlock|diagnose|repairAdvanced|flattenForms) ' docs/architecture/_CATALOGO_RAW.md)" -eq 34

  admin-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Test private API contracts
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: Install browser test dependencies
        run: |
          python -m pip install -r ../requirements-test.txt
          python -m playwright install --with-deps chromium firefox
      - name: Test admin browser flows with isolated provider fixtures
        env:
          CENTRALPDF_ADMIN_QA: ${{ runner.temp }}/admin-staging-evidence
        run: python tests/browser.py
      - name: Preserve admin screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: admin-staging-evidence
          path: ${{ runner.temp }}/admin-staging-evidence
          if-no-files-found: warn
          retention-days: 14
