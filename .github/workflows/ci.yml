name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: server/go.mod

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Install browser regression engine
        run: npm ci --prefix app --ignore-scripts

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find assets/js -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check sw.js

      - name: Run JavaScript tests
        shell: bash
        run: find tests -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node

      - name: Run Python tests
        shell: bash
        run: |
          find tests -maxdepth 1 -name '*.test.py' -print0 | sort -z | xargs -0 -n1 python
          python tests/static_integrity.py

      - name: Run Go tests
        working-directory: server
        run: go test ./...

      - name: Vet Go server
        working-directory: server
        run: go vet ./...

      - name: Verify reproducible Windows executable
        shell: bash
        run: |
          sha256sum -c checksums.sha256
          cd server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o ../CentralPDF_Local_Server.ci.exe .
          cd ..
          cmp --silent CentralPDF_Local_Server.exe CentralPDF_Local_Server.ci.exe

  app-2-0:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Run Vitest tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Check catalog file is up to date
        working-directory: ./
        run: |
          node scripts/extract-tool-catalog.mjs
          git diff --exit-code -- docs/architecture/_CATALOGO_RAW.md
          test "$(grep -cE '^\| (organize|editPdf|merge|split|extract|rotate|watermark|pageNumbers|imagesToPdf|imageConvert|compress|pdfToImage|crop|metadata|normalize|pdfToText|ocr|compare|redact|formBuilder|signPdf|pdfToOffice|documentsToPdf|extractImages|archivePdf|documentAssistant|structuredExtraction|documentAudit|classifyRename|protect|unlock|diagnose|repairAdvanced|flattenForms) ' docs/architecture/_CATALOGO_RAW.md)" -eq 34
