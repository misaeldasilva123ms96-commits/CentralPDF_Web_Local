name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bootstrap restricted PDF editor fix
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' && hashFiles('scripts/run-editor-restricted-pdf-migration.py') != ''
        shell: bash
        run: |
          python scripts/run-editor-restricted-pdf-migration.py
          node --check assets/js/pdf-editor.js
          node --check sw.js
          node tests/pdf-editor.test.js
          node tests/pdf-editor-orientation.test.js
          node tests/pdf-editor-restricted.test.js
          python tests/editor-orientation-delivery.test.py
          python tests/version-sync-1.1.1.test.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/ci.yml
          git rm scripts/apply-editor-restricted-pdf-fix.py scripts/run-editor-restricted-pdf-migration.py
          git add assets/js/pdf-editor.js sw.js CHANGELOG.md tests/version-sync-1.1.1.test.py tests/editor-orientation-delivery.test.py tests/workspace-visual-fixes-1.2.2.test.py tests/pdf-editor-restricted.test.js tests/editor-restricted-runtime.test.py
          git commit -m 'fix: support restricted PDFs and isolate editor renders'
          git push origin HEAD:${{ github.head_ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: server/go.mod

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find assets/js -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check sw.js

      - name: Run JavaScript tests
        shell: bash
        run: find tests -maxdepth 1 -name '*.js' -print0 | sort -z | xargs -0 -n1 node

      - name: Run Python tests
        shell: bash
        run: |
          find tests -maxdepth 1 -name '*.test.py' -print0 | sort -z | xargs -0 -n1 python
          python tests/static_integrity.py

      - name: Run Go tests
        working-directory: server
        run: go test ./...

      - name: Vet Go server
        working-directory: server
        run: go vet ./...

      - name: Verify reproducible Windows executable
        shell: bash
        run: |
          sha256sum -c checksums.sha256
          cd server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o ../CentralPDF_Local_Server.ci.exe .
          cd ..
          cmp --silent CentralPDF_Local_Server.exe CentralPDF_Local_Server.ci.exe
