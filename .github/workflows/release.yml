name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify that the tagged commit belongs to main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: server/go.mod

      - name: Rebuild and verify the Windows executable
        shell: bash
        run: |
          cd server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o ../CentralPDF_Local_Server.release.exe .
          cd ..
          sha256sum -c checksums.sha256
          cmp --silent CentralPDF_Local_Server.exe CentralPDF_Local_Server.release.exe

      - name: Download and verify offline engines
        shell: pwsh
        run: ./scripts/prepare-offline.ps1

      - name: Assemble release package and checksums
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.Substring(1)
          ./scripts/build-release.ps1 -Version $version -OutputDirectory '${{ runner.temp }}/release'

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.exe
            ${{ runner.temp }}/release/*.sha256

      - name: Publish release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release $GITHUB_REF_NAME já existe; os artefatos não serão substituídos."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${{ runner.temp }}"/release/* \
            --verify-tag \
            --fail-on-no-commits \
            --generate-notes \
            --title "Central PDF & Imagem ${GITHUB_REF_NAME#v}"
