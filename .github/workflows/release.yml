name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v2.0.0-alpha.2); se não existir, será criada a partir da main"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: server/go.mod

      - name: Resolve release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./app/package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Versao invalida no app/package.json: $version"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            requested="$INPUT_TAG"
            if [[ ! "$requested" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag informada invalida: $requested"
              exit 1
            fi
            if [[ "${requested#v}" != "$version" ]]; then
              echo "A tag $requested nao corresponde a versao $version do app/package.json."
              exit 1
            fi
            tag="$requested"
          else
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "${tag#v}" != "$version" ]]; then
              echo "A tag $tag nao corresponde a versao $version do app/package.json."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          git fetch origin --tags
          resolved="$(git rev-parse "refs/tags/$tag^{commit}" 2>/dev/null || echo "$GITHUB_SHA")"
          if [[ "$resolved" != "$GITHUB_SHA" ]]; then
            base_sha="$resolved"
          else
            base_sha="$GITHUB_SHA"
          fi
          if ! git merge-base --is-ancestor "$base_sha" origin/main 2>/dev/null; then
            echo "O commit da tag $tag nao pertence a main."
            exit 1
          fi
          echo "commit=$resolved" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A release $tag ja existe; nenhuma substituicao sera realizada."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release commit
        if: steps.metadata.outputs.publish == 'true' && steps.metadata.outputs.commit != github.sha
        run: git checkout "${{ steps.metadata.outputs.commit }}"

      - name: Install application dependencies
        if: steps.metadata.outputs.publish == 'true'
        working-directory: app
        run: npm ci

      - name: Build CentralPDF 2.0
        if: steps.metadata.outputs.publish == 'true'
        working-directory: app
        run: npm run build

      - name: Build and verify reproducible Windows executable
        if: steps.metadata.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o ../CentralPDF_Local_Server.release-1.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o ../CentralPDF_Local_Server.release-2.exe .
          cd ..
          cmp --silent CentralPDF_Local_Server.release-1.exe CentralPDF_Local_Server.release-2.exe
          mv CentralPDF_Local_Server.release-1.exe CentralPDF_Local_Server.release.exe
          rm CentralPDF_Local_Server.release-2.exe

      - name: Assemble release package and checksums
        if: steps.metadata.outputs.publish == 'true'
        shell: pwsh
        run: |
          ./scripts/build-release.ps1 `
            -Version '${{ steps.metadata.outputs.version }}' `
            -OutputDirectory '${{ runner.temp }}/release' `
            -ServerExecutable './CentralPDF_Local_Server.release.exe'

      - name: Attest release provenance
        if: steps.metadata.outputs.publish == 'true'
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.exe
            ${{ runner.temp }}/release/*.sha256

      - name: Create or verify release tag
        if: steps.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.metadata.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          existing_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing_ref" ]]; then
            existing_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}" 2>/dev/null || echo "$existing_ref")"
            if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
              echo "A tag $RELEASE_TAG ja aponta para outro commit: $existing_commit"
              exit 1
            fi
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$RELEASE_COMMIT" >/dev/null
          fi

      - name: Publish release without replacing existing assets
        if: steps.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          IS_PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="${{ runner.temp }}/release"
          release_assets=(
            "$release_dir/CentralPDF_Web_Local_v$RELEASE_VERSION.zip"
            "$release_dir/CentralPDF_Local_Server.exe"
            "$release_dir/CentralPDF_Web_Local_v$RELEASE_VERSION.sha256"
          )
          for asset in "${release_assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Artefato obrigatório ausente: $asset"
              exit 1
            fi
          done

          release_flags=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --fail-on-no-commits \
            --notes-file "docs/releases/$RELEASE_VERSION.md" \
            --title "CentralPDF $RELEASE_VERSION" \
            "${release_flags[@]}"
