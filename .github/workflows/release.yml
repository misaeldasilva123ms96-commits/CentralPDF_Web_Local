name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag versionada já existente (ex.: v1.2.1)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify that the tagged commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválida: $RELEASE_TAG"
            exit 1
          fi
          git fetch origin main --tags
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: server/go.mod

      - name: Rebuild and verify the Windows executable
        shell: bash
        run: |
          cd server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o ../CentralPDF_Local_Server.release.exe .
          cd ..
          sha256sum -c checksums.sha256
          cmp --silent CentralPDF_Local_Server.exe CentralPDF_Local_Server.release.exe

      - name: Download and verify offline engines
        shell: pwsh
        run: ./scripts/prepare-offline.ps1

      - name: Assemble release package and checksums
        shell: pwsh
        run: |
          $version = '${{ env.RELEASE_TAG }}'.Substring(1)
          ./scripts/build-release.ps1 -Version $version -OutputDirectory '${{ runner.temp }}/release'

      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*.exe
            ${{ runner.temp }}/release/*.sha256

      - name: Publish release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release $RELEASE_TAG já existe; os artefatos não serão substituídos."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          release_dir="${{ runner.temp }}/release"
          release_assets=(
            "$release_dir/CentralPDF_Web_Local_v$version.zip"
            "$release_dir/CentralPDF_Local_Server.exe"
            "$release_dir/CentralPDF_Web_Local_v$version.sha256"
          )
          for asset in "${release_assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Artefato obrigatório ausente: $asset"
              exit 1
            fi
          done

          gh release create "$RELEASE_TAG" "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --fail-on-no-commits \
            --generate-notes \
            --title "Central PDF & Imagem ${RELEASE_TAG#v}"
