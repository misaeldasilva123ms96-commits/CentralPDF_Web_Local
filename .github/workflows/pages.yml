name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache verified browser engines
        uses: actions/cache@v6
        with:
          path: |
            vendor/pdf-lib.min.js
            vendor/pdfjs
            vendor/pdfjs-manifest.js
            vendor/UTIF.js
            vendor/heic2any.min.js
            vendor/tesseract
            vendor/tesseract-core
            vendor/tessdata
          key: ${{ runner.os }}-centralpdf-engines-${{ hashFiles('scripts/prepare-offline.ps1') }}

      - name: Download and verify browser engines
        shell: pwsh
        run: ./scripts/prepare-offline.ps1

      - name: Assemble static site
        shell: bash
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R assets vendor _site/
          touch _site/.nojekyll

      - name: Verify deployment scope
        shell: bash
        run: |
          test -f _site/index.html
          test -f _site/vendor/offline-status.js
          test -f _site/vendor/pdfjs/pdf.min.mjs
          test -f _site/vendor/pdfjs/pdf.worker.min.mjs
          test -f _site/vendor/pdfjs/LICENSE
          test -f _site/vendor/pdfjs-manifest.js
          test -f _site/vendor/tesseract-core/tesseract-core-relaxedsimd-lstm.wasm.js
          test ! -e _site/CentralPDF_Local_Server.exe
          test ! -e _site/server
          test ! -e _site/tests

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
