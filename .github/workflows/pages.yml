name: Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install application dependencies
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npx tsc -b --noEmit

      - name: Run Vitest tests
        working-directory: app
        run: npm run test

      - name: Build CentralPDF 2.0
        working-directory: app
        run: npm run build

      - name: Check release version synchronization
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./app/package.json').version")"
          grep -F "const BUILD_VERSION = '$version';" app/src/App.tsx
          grep -F "const appVersion = \"$version\"" server/main.go

      - name: Install production test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Run production UI smoke test
        env:
          PYTHONPATH: "${{ github.workspace }}/tests"
        run: python tests/production-ui-2.0.test.py

      - name: Assemble static site
        shell: bash
        run: |
          mkdir _site
          cp -R app/dist/. _site/
          touch _site/.nojekyll

      - name: Verify deployment scope
        shell: bash
        run: |
          test -f _site/index.html
          test -d _site/assets
          test -f _site/standard_fonts/LiberationSans-Regular.ttf
          test -f _site/standard_fonts/LICENSE_LIBERATION
          test ! -e _site/server
          test ! -e _site/tests
          test ! -e _site/CentralPDF_Local_Server.exe

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
