name: Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Cache verified browser engines
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache@v6
        with:
          path: |
            vendor/pdf-lib.min.js
            vendor/pdfjs
            vendor/pdfjs-manifest.js
            vendor/UTIF.js
            vendor/heic2any.min.js
            vendor/tesseract
            vendor/tesseract-core
            vendor/tessdata
          key: ${{ runner.os }}-centralpdf-engines-${{ hashFiles('scripts/prepare-offline.ps1') }}

      - name: Download and verify browser engines
        shell: pwsh
        run: ./scripts/prepare-offline.ps1

      - name: Assemble static site
        shell: bash
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R assets vendor _site/
          touch _site/.nojekyll

      - name: Validate static assets, cache revisions and engine hashes
        run: python3 scripts/verify-static-site.py _site --require-engines

      - name: Verify deployment scope
        shell: bash
        run: |
          test -f _site/index.html
          test -f _site/vendor/offline-status.js
          test -f _site/vendor/pdfjs/pdf.min.mjs
          test -f _site/vendor/pdfjs/pdf.worker.min.mjs
          test -f _site/vendor/pdfjs/LICENSE
          test -f _site/vendor/pdfjs-manifest.js
          test -f _site/vendor/tesseract-core/tesseract-core-relaxedsimd-lstm.wasm.js
          test ! -e _site/CentralPDF_Local_Server.exe
          test ! -e _site/server
          test ! -e _site/tests

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install real browser regression dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium firefox

      - name: Exercise real prepared tools, offline reload and editor browsers
        run: |
          python tests/tool-regression-real.py --site _site --report "${{ runner.temp }}/stabilization-evidence/tools.json"
          python tests/offline-tools-real.py --site _site --report "${{ runner.temp }}/stabilization-evidence/offline.json"
          python tests/editor-cross-browser-real.py --site _site --report "${{ runner.temp }}/stabilization-evidence/editor.json"

      - name: Preserve synthetic regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: stabilization-evidence
          path: ${{ runner.temp }}/stabilization-evidence
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # actions/deploy-pages@v5
